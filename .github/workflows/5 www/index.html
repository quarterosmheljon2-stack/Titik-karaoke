
<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titik Karaoke</title>
<style>
  :root { --bg:#fff7e6; --ink:#2b2b2b; --card:#fff; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#facc15; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink);
         padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); min-height:100vh; }
  h1 { text-align:center; font-size:22px; margin:12px 0 4px; }
  .stars { text-align:center; font-size:15px; margin-bottom:8px; }
  .card { background:var(--card); border-radius:24px; padding:16px; text-align:center;
          box-shadow:0 4px 0 rgba(0,0,0,.12); border:6px solid var(--yellow); transition:border-color .2s, background .2s; }
  .card.ok { border-color:var(--green); background:#dcfce7; }
  .card.bad { border-color:var(--red); background:#fee2e2; }
  .big { font-size:96px; font-weight:800; line-height:1; }
  .word { font-size:30px; font-weight:700; margin:4px 0; }
  .emoji { font-size:64px; }
  .msg { min-height:48px; font-size:18px; font-weight:600; margin-top:6px; }
  .heard { font-size:13px; opacity:.65; min-height:18px; }
  .row { display:flex; gap:10px; margin-top:12px; }
  button { font:inherit; border:0; border-radius:18px; padding:14px; font-weight:700; font-size:17px;
           color:#fff; background:var(--blue); box-shadow:0 4px 0 rgba(0,0,0,.2); flex:1; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.2); }
  #mic { background:var(--green); font-size:22px; padding:18px; }
  #mic.on { background:var(--red); animation:pulse 1s infinite; }
  #karaoke { background:#a855f7; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:14px 0; }
  .grid button { padding:10px 0; font-size:18px; background:#fff; color:var(--ink); border:2px solid #e5e7eb; box-shadow:none; }
  .grid button.done { background:var(--green); color:#fff; border-color:var(--green); }
  .grid button.sel { outline:4px solid var(--blue); }
</style>
</head>
<body>
<h1>🎤 Titik Karaoke</h1>
<div class="stars" id="stars"></div>

<div class="card" id="card">
  <div class="big" id="letter">A</div>
  <div class="emoji" id="emoji">🍎</div>
  <div class="word" id="word">Apple</div>
  <div class="msg" id="msg">Pindutin ang mic at sabihin: “A for Apple”</div>
  <div class="heard" id="heard"></div>
</div>

<div class="row">
  <button id="listen">🔊 Pakinggan</button>
  <button id="mic">🎙️ Magsalita</button>
</div>
<div class="row">
  <button id="karaoke">🎵 Kantahin ang A–Z</button>
</div>

<div class="grid" id="grid"></div>

<script>
// titik, salita, emoji, at mga tunog na tinatanggap ng speech recognition
const LETTERS = [
  { l:'A', w:'Apple',     e:'🍎', a:['a','ay','hey','eh','8'] },
  { l:'B', w:'Ball',      e:'⚽', a:['b','bee','be','bi','v'] },
  { l:'C', w:'Cat',       e:'🐱', a:['c','see','sea','si'] },
  { l:'D', w:'Dog',       e:'🐶', a:['d','dee','di','the'] },
  { l:'E', w:'Egg',       e:'🥚', a:['e','ee','he'] },
  { l:'F', w:'Fish',      e:'🐟', a:['f','ef','eff','if'] },
  { l:'G', w:'Goat',      e:'🐐', a:['g','gee','ji','jee'] },
  { l:'H', w:'Hat',       e:'🎩', a:['h','aitch','eich','age','ech'] },
  { l:'I', w:'Ice cream', e:'🍦', a:['i','eye','ai','aye'] },
  { l:'J', w:'Jar',       e:'🫙', a:['j','jay','jey'] },
  { l:'K', w:'Kite',      e:'🪁', a:['k','kay','kei','okay'] },
  { l:'L', w:'Lion',      e:'🦁', a:['l','el','elle','al'] },
  { l:'M', w:'Moon',      e:'🌙', a:['m','em','am'] },
  { l:'N', w:'Nest',      e:'🪹', a:['n','en','and','in'] },
  { l:'O', w:'Orange',    e:'🍊', a:['o','oh','owe','0'] },
  { l:'P', w:'Pen',       e:'🖊️', a:['p','pee','pea','pi'] },
  { l:'Q', w:'Queen',     e:'👑', a:['q','queue','cue','kyu','kew'] },
  { l:'R', w:'Rabbit',    e:'🐰', a:['r','are','ar','our'] },
  { l:'S', w:'Sun',       e:'☀️', a:['s','es','ess','yes'] },
  { l:'T', w:'Tree',      e:'🌳', a:['t','tee','tea','ti'] },
  { l:'U', w:'Umbrella',  e:'☂️', a:['u','you','yu','ew'] },
  { l:'V', w:'Van',       e:'🚐', a:['v','vee','vi','we'] },
  { l:'W', w:'Water',     e:'💧', a:['w','double u','doubleu','double you','doubleyou'] },
  { l:'X', w:'X-ray',     e:'🩻', a:['x','ex','eggs'] },
  { l:'Y', w:'Yo-yo',     e:'🪀', a:['y','why','wai','wy'] },
  { l:'Z', w:'Zebra',     e:'🦓', a:['z','zee','zed','zi'] },
];

let idx = 0, busy = false, stopKaraoke = false;
let done = JSON.parse(localStorage.getItem('titik_done') || '[]');
const $ = id => document.getElementById(id);

function render() {
  const d = LETTERS[idx];
  $('letter').textContent = d.l; $('emoji').textContent = d.e; $('word').textContent = d.w;
  $('card').className = 'card'; $('heard').textContent = '';
  $('msg').textContent = `Pindutin ang mic at sabihin: “${d.l} for ${d.w}”`;
  [...$('grid').children].forEach((b, i) => {
    b.classList.toggle('sel', i === idx);
    b.classList.toggle('done', done.includes(LETTERS[i].l));
  });
  $('stars').textContent = `⭐ ${done.length} / 26 na tamang sagot`;
}
function buildGrid() {
  LETTERS.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = d.l;
    b.onclick = () => { idx = i; render(); speak(`${d.l} for ${d.w}`); };
    $('grid').appendChild(b);
  });
}

// Teacher voice
function speak(text, rate = 0.8, pitch = 1.3) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate; u.pitch = pitch;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}

// Speech recognition (native sa Android app, Web Speech API sa browser)
async function listen() {
  const cap = window.Capacitor;
  const Native = cap && cap.Plugins && cap.Plugins.SpeechRecognition;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && Native) {
    const perm = await Native.requestPermissions();
    if (perm.speechRecognition !== 'granted') throw new Error('NO_PERMISSION');
    const r = await Native.start({ language:'en-US', maxResults:5, partialResults:false, popup:false });
    return r.matches || [];
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) throw new Error('NOT_SUPPORTED');
  return new Promise((resolve, reject) => {
    const rec = new SR();
    rec.lang = 'en-US'; rec.maxAlternatives = 5; rec.interimResults = false;
    rec.onresult = e => resolve([...e.results[0]].map(x => x.transcript));
    rec.onerror = e => reject(new Error(e.error));
    rec.onnomatch = () => resolve([]);
    rec.start();
  });
}

// Pag-check ng sagot
function norm(s) { return s.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function check(matches, d) {
  const word = norm(d.w).replace(/ /g, '');
  let gotLetter = false, gotWord = false;
  for (const m of matches) {
    const n = norm(m), tokens = n.split(' ');
    if (n.replace(/ /g, '').includes(word) || n.includes(norm(d.w))) gotWord = true;
    if (d.a.some(a => tokens.includes(a) || n === a)) gotLetter = true;
    if (tokens.includes('for') && gotWord) gotLetter = true;
  }
  return { gotLetter, gotWord, ok: gotLetter || gotWord };
}

async function answer() {
  if (busy) return;
  busy = true; $('mic').classList.add('on'); $('card').className = 'card';
  $('msg').textContent = '👂 Nakikinig...'; $('heard').textContent = '';
  const d = LETTERS[idx];
  try {
    const matches = await listen();
    $('heard').textContent = matches.length ? 'Narinig: “' + matches[0] + '”' : '';
    const r = check(matches, d);
    if (r.ok) {
      $('msg').textContent = (r.gotLetter && r.gotWord) ? `🎉 Tama! ${d.l} for ${d.w}!` : `✅ Tama! ${d.l} for ${d.w}`;
      if (!done.includes(d.l)) { done.push(d.l); localStorage.setItem('titik_done', JSON.stringify(done)); }
      const msg = $('msg').textContent, heard = $('heard').textContent;
      render();
      $('msg').textContent = msg; $('heard').textContent = heard;
      $('card').className = 'card ok';
      speak('Very good!');
    } else {
      $('card').className = 'card bad';
      $('msg').textContent = `❌ Subukan ulit: “${d.l} for ${d.w}”`;
      speak(`${d.l} for ${d.w}`);
    }
  } catch (e) {
    $('card').className = 'card bad';
    $('msg').textContent = e.message === 'NO_PERMISSION' ? 'Kailangan i-allow ang microphone.' :
                           e.message === 'NOT_SUPPORTED' ? 'Hindi supported ang speech recognition dito.' :
                           'Walang narinig. Subukan ulit!';
  }
  $('mic').classList.remove('on'); busy = false;
}

// Karaoke mode
async function karaoke() {
  if ($('karaoke').dataset.on === '1') { stopKaraoke = true; speechSynthesis.cancel(); return; }
  $('karaoke').dataset.on = '1'; $('karaoke').textContent = '⏹️ Itigil'; stopKaraoke = false;
  for (let i = 0; i < LETTERS.length && !stopKaraoke; i++) {
    idx = i; render();
    await speak(`${LETTERS[i].l} for ${LETTERS[i].w}`, 0.75, 1.5);
  }
  $('karaoke').dataset.on = '0'; $('karaoke').textContent = '🎵 Kantahin ang A–Z';
}

$('listen').onclick = () => speak(`${LETTERS[idx].l} for ${LETTERS[idx].w}`);
$('mic').onclick = answer;
$('karaoke').onclick = karaoke;
buildGrid(); render();
</script>
</body>
  </html>
